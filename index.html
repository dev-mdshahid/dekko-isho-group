<!doctype html>
<html lang="en" data-wf-page="6a26a196936d1b3aae320c59" data-wf-site="6a26a190936d1b3aae320bc8" class="splash-boot">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Mona+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/legacy/images/webclip.svg" />
    <link rel="preload" href="/dekko-logo.svg" as="image" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dekko Isho Group</title>
    <!-- Critical first-paint splash: covers the page before JS/CSS bundles load -->
    <style>
      html.splash-boot,
      html.splash-boot body {
        background: #ffffff;
      }

      html.splash-boot #root,
      html.splash-active:not(.splash-revealing):not(.splash-handoff):not(.splash-done) #root {
        opacity: 0;
        pointer-events: none;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding:
          max(1.5rem, env(safe-area-inset-top))
          max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom))
          max(1.5rem, env(safe-area-inset-left));
        background: transparent;
      }

      #boot-splash .splash-backdrop {
        position: absolute;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(120% 80% at 50% 40%, rgba(37, 149, 213, 0.06) 0%, transparent 55%),
          linear-gradient(180deg, #ffffff 0%, #f7fafc 100%);
        pointer-events: none;
      }

      #boot-splash .splash-stage {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: min(72vw, 22rem);
      }

      #boot-splash .splash-logo-wrap {
        position: relative;
        display: block;
        width: 100%;
      }

      #boot-splash .splash-logo {
        display: block;
        width: 100%;
        height: auto;
        max-height: min(28vh, 9rem);
        object-fit: contain;
        opacity: 0;
        transform: scale(0.62);
        transform-origin: center center;
      }

      @media (max-width: 991px) {
        #boot-splash .splash-stage {
          width: min(78vw, 16rem);
        }

        #boot-splash .splash-logo {
          max-height: min(22vh, 6.5rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html.splash-boot #root {
          opacity: 1;
          pointer-events: auto;
        }

        #boot-splash {
          display: none !important;
        }
      }
    </style>
    <script>
      // Skip the boot splash immediately when the user prefers reduced motion.
      (function () {
        try {
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.remove('splash-boot')
            document.documentElement.classList.add('splash-done')
          }
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Loading Dekko Isho Group">
      <div class="splash-backdrop" aria-hidden="true"></div>
      <div class="splash-stage">
        <div class="splash-logo-wrap">
          <img
            class="splash-logo"
            src="/dekko-logo.svg"
            alt="Dekko Isho Group"
            width="320"
            height="128"
            decoding="sync"
            fetchpriority="high"
          />
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
